[package]
name = "truespec"
version = "0.1.0"
edition = "2024"
description = "Review project documentation and hand feedback to a coding agent"
license = "MIT"
repository = "https://github.com/samjingwen/truespec"
homepage = "https://github.com/samjingwen/truespec"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
fs2 = "0.4"
getrandom = "0.3"
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
percent-encoding = "2"
pulldown-cmark = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
